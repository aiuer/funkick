  return THEME_ORDER.map(k=>{
    const t=THEMES[k], ok=themeAvailable(k);
    return '<button class="tbtn'+(S.theme===k?' sel':'')+(ok?'':' miss')+'" data-t="'+k+'"'+
      (ok?'':' disabled')+'>'+t.name+'<small>'+(ok?themeSub(k):'图集文件缺失 · 需与 HTML 同目录')+'</small></button>';
  }).join('');
}
/* 图集张数少于棋盘容量时的提醒（同图复用不影响判定，但先说清楚） */
function themeHintText(){
  const pk=themePack(S.theme); if(!pk) return '';
  const M=CONFIG.modes[S.mode];
  const cap=(M.cols/2)*(M.rows/2);
  if(cap<=pk.photos.length) return '';
  return '图集共 '+pk.photos.length+' 张，'+M.name+'模式要同时排 '+cap+' 张 —— 盘面会有 '+
    (cap-pk.photos.length)+' 张重复照片。它们各自都能拼成一块消除，判定照样成立。';
}
function renderThemeHint(){
  const el=$('themeHint'); if(!el) return;
  el.textContent=themeHintText();
  el.style.display = el.textContent ? '' : 'none';
}
/* 主题落地：换配色 + 顶栏标识 */
function applyTheme(){
  const t=THEMES[S.theme]||THEMES.classic;
  document.body.dataset.theme=t.key;
  $('logoTheme').textContent=t.name;
  syncThemeChips();
}
function syncThemeChips(){
  $('themeChips').innerHTML=THEME_ORDER.filter(k=>themeAvailable(k)).map(k=>{
    const t=THEMES[k];
    return '<button data-t="'+k+'"'+(S.theme===k?' class="on"':'')+'>'+t.short+'</button>';
  }).join('');
}

function openMenu(){
  cancelDrag();
  S.run++; gameTimers.forEach(id=>clearTimeout(id)); gameTimers.clear(); hideCelebrate();
  S.phase='menu'; stopTimer();
  S.undo=null; pauseReasons.clear(); S.paused=false;
  updateControls();
  const m=n=>CONFIG.modes[n];
  const opts=['tutorial','relax','normal','hard'].map(k=>{
    const c=m(k);
    return '<button class="opt '+(S.mode===k?'sel':'')+'" data-m="'+k+'" aria-pressed="'+(S.mode===k)+'">'+
      '<b>'+c.name+'模式</b><small>棋盘 '+c.cols+'×'+c.rows+' ＝ '+c.cols*c.rows+' 格<br>'+
      '同时 '+(c.cols/2*c.rows/2)+' 张图 · 消 '+c.target+' 张通关<br>'+
      (c.timeStart>0 ? '限时 '+fmtTime(c.timeStart)+' · 每消一张 +'+c.timeBonus+'s · '+c.lives+' 条命'
                     : (k==='tutorial'?'不限时 · 接缝练习':'不限时 · 自由拼合'))+'</small></button>';
  }).join('');
  showModal('<h2>拼图消消乐</h2><p class="desc">选择本局图集与模式</p>'+
    '<div class="themerow" id="themeRow">'+themeRowHTML()+'</div>'+
    '<div class="optgrid">'+opts+'</div>'+
    '<div class="desc" id="themeHint" style="font-size:12px;margin:-4px 0 10px;display:none"></div>'+
    '<label class="toggleline"><input type="checkbox" id="prefLinks"'+(progress.preferences.links!==false?' checked':'')+'>接缝反馈</label>'+
    '<label class="toggleline"><input type="checkbox" id="prefMotion"'+(progress.preferences.motion!==false?' checked':'')+'>庆祝动效</label>'+
    '<div class="upzone" id="upzone" role="button" tabindex="0">＋ 上传自己的图片</div>'+
    '<div class="statusline" id="uploadStatus" role="status">'+(uploadPool.length?'已加入 '+uploadPool.length+' 张图片':'')+'</div>'+
    '<div class="btns"><button class="primary" id="goBtn">开始游戏</button>'+
    '<button onclick="openCollection()">收藏与成就</button><button onclick="showHelp()">玩法说明</button></div>',null,false);
  const trow=$('sheet').querySelector('#themeRow');
  trow.querySelectorAll('.tbtn').forEach(b=>{
    if(b.disabled) return;
    b.onclick=()=>{
      if(S.theme===b.dataset.t) return;
      trow.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      S.theme=b.dataset.t; applyTheme(); Sfx.theme(); renderThemeHint();
    };
  });
  const grid=$('sheet').querySelector('.optgrid');
  grid.querySelectorAll('.opt').forEach(o=>{
    o.onclick=()=>{ grid.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel'); x.setAttribute('aria-pressed','false');});
      o.classList.add('sel'); o.setAttribute('aria-pressed','true'); S.mode=o.dataset.m; renderThemeHint(); };
  });
  $('upzone').onclick=()=>$('fileInput').click();
  $('upzone').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fileInput').click();}};
  ['Links','Motion'].forEach(name=>$('pref'+name).onchange=e=>{
    progress.preferences[name.toLowerCase()]=e.target.checked; saveProgress(); markCorrect();
  });
  $('goBtn').onclick=()=>{ startGame(S.mode); };
  renderThemeHint();
  syncChips();
}
window.openMenu=openMenu;

function showHelp(){
  showModal('<h2>玩法说明</h2><p class="desc">'+
    '<b>拼合</b>：交换或拖动碎片，把同图四块按原图方向排成相邻 2×2；棋盘任意位置都算。<br><br>'+
    '<b>接缝</b>：正确相邻的碎片会亮起绿色描边，三块就位时亮度更高。<br><br>'+
    '<b>补牌与区域</b>：新图四块分散进入四个区域，原有碎片优先保留正确接缝；需要腾位置的碎片移入消除空位。教学就地补牌。在指定区域完成额外 +75 分，限时模式另加 4 秒。<br><br>'+
    '<b>连击</b>：第一张 ×1，12 秒内连续完成依次 ×1.2、×1.5、×2。暂停和消除动画不占连击时间。<br><br>'+
    '<b>工具</b>：灯泡提示下一步，弯箭头撤销尚未消除的最后一次交换。放大镜可查看碎片，按住碎片也能放大。<br><br>'+
    '<b>模式</b>：教学和休闲不限时；普通 82 秒、困难 165 秒，每完成一张分别加 12 / 20 秒。时间到扣一条命并重新打乱。<br><br>'+
    '<b>收藏</b>：主题图片完成后解锁相册，个人最佳成绩和成就会保留到下一局。</p>'+
    '<div class="btns"><button class="primary" onclick="hideModal()">返回</button></div>',()=>{
      if(S.phase==='menu') openMenu();
      else if(S.phase==='over') showResultReturn();
    });
}
window.showHelp=showHelp;
window.closeSheet=function(){
  if(modalDismissible) hideModal();
};
$('overlay').addEventListener('click',e=>{
  if(e.target.id==='overlay') window.closeSheet();
});

/* ==================== upload ==================== */
const uploadReads=[];
$('fileInput').addEventListener('change',e=>{
  const files=[...e.target.files||[]];
  const addToCurrentGame=['playing','resolving'].includes(S.phase),run=S.run;
  files.filter(f=>f.type.startsWith('image/')).forEach(f=>{
    const read=new Promise(resolve=>{
    const fr=new FileReader();
    fr.onerror=()=>{toast('图片读取失败');resolve();};
    fr.onload=async()=>{
      const img=new Image(); img.src=fr.result;
      try{ await img.decode(); }catch(e){toast('这张图片无法打开');resolve();return;}
      const cv=document.createElement('canvas'),scale=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
      cv.width=Math.max(1,Math.round(img.naturalWidth*scale)); cv.height=Math.max(1,Math.round(img.naturalHeight*scale));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const key='up'+(++uploadSeq);
      const pic={id:key,key,kind:'upload',title:f.name,url:cv.toDataURL('image/jpeg',.9),src:cv,cvs:{},thumb:null,steps:0};
      if(addToCurrentGame && run===S.run){ S.queue.unshift(pic); renderQueue(); }
      else uploadPool.push(pic);
      if($('uploadStatus')) $('uploadStatus').textContent='已加入 '+uploadPool.length+' 张图片';
      else $('gameStatus').textContent='自定义图片已加入候补区';
      resolve();
    };
    fr.readAsDataURL(f);
    });
    uploadReads.push(read);
    read.finally(()=>{const i=uploadReads.indexOf(read);if(i>=0) uploadReads.splice(i,1);});
  });
  e.target.value='';
});

/* ==================== ui wiring ==================== */
$('themeChips').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const k=b.dataset.t;
  if(!themeAvailable(k) || S.theme===k) return;
  S.theme=k; applyTheme(); Sfx.theme();
  if(S.phase!=='menu') startGame(S.mode);
});
$('modeChips').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(S.mode===b.dataset.m && S.phase!=='menu') return;
  S.mode=b.dataset.m; syncChips();
  if(S.phase!=='menu') startGame(S.mode);
});
function syncChips(){
  $('modeChips').querySelectorAll('button').forEach(b=>
    b.classList.toggle('on', b.dataset.m===S.mode));
}
/* ⚙ 设置下拉（仅窄屏出现）：音效/玩法/重开 三个按钮原本要占一整行，
   收进下拉后省下的高度全给棋盘。点任意一项即关闭，点空白处也关闭。 */
function closeTools(){ const t=$('tools'); if(t) t.classList.remove('open'); }
$('btnTools').onclick=e=>{ e.stopPropagation(); $('tools').classList.toggle('open'); };
$('tools').addEventListener('click',e=>{
  if(e.target.closest('button')) closeTools();
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#tools') && e.target.id!=='btnTools') closeTools();
});
$('btnMute').onclick=()=>{ const on=Sfx.toggle(); $('btnMute').innerHTML='<i data-lucide="'+(on?'volume-2':'volume-x')+'"></i><span>'+(on?'音效':'静音')+'</span>'; refreshIcons(); };
$('btnHelp').onclick=()=>showHelp();
$('btnRestart').onclick=()=>{ openMenu(); };
$('btnHint').onclick=()=>useHint();
$('btnUndo').onclick=undoSwap;
$('btnPause').onclick=()=>{
  showModal('<h2>已暂停</h2><p class="desc">已完成 '+S.cleared+' / '+S.M.target+' 张</p>'+
    '<div class="btns"><button class="primary" onclick="hideModal()">继续游戏</button>'+
    '<button onclick="openCollection()">收藏与成就</button></div>');
};
$('btnInspect').onclick=()=>{ if(!canPlay()) return; S.inspect=!S.inspect; updateControls(); };
$('btnCollection').onclick=()=>openCollection();
$('btnShuffle').onclick=()=>{
  if(!canPlay()) return;
  S.shufflesUsed++;
  S.score=Math.max(0,S.score-CONFIG.SHUFFLE_COST);
  reshuffleAll(); updateHud();
};
$('btnUpload').onclick=()=>$('fileInput').click();
/* 转屏 / 改窗口大小：重算格子边长 + 重排候补牌，加 120ms 防抖（转屏瞬间会连发好几次） */
let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ if(S.pieces.length){ layoutBoard(); renderQueue(); } },120);
});
window.addEventListener('orientationchange',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ if(S.pieces.length){ layoutBoard(); renderQueue(); } },260);
});
window.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if($('overlay').classList.contains('on')){
    if(e.key==='Escape'){e.preventDefault();window.closeSheet();}
    if(e.key==='Tab'){
      const buttons=[...$('sheet').querySelectorAll('button:not(:disabled),input,[tabindex="0"]')];
      const first=buttons[0],last=buttons[buttons.length-1];
      if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
    }
    return;
  }
  if(e.key==='h'||e.key==='H') useHint();
  if(e.key==='m'||e.key==='M') $('btnMute').click();
  if(e.key==='Escape') clearHint();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoSwap();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pauseGame('background');hideCelebrate();}
  else resumeGame('background');
});

/* ==================== test hooks ==================== */
window.__game=S; window.__swap=doSwap; window.__start=startGame; window.__resolve=tryResolve;
/* 内置自动解法（仅自测用：地址栏加 #autosolve 触发） */
function autoSolveStep(){
  if(S.phase==='over'||S.phase==='menu') return;
  if(!canPlay()||!S.pieces.length){ gameLater(autoSolveStep,420); return; }
  const best=bestProgress();
  if(best && best.cnt<4 && best.missing.length){
    const pick=planHook(best);
    if(pick){ doSwap(pick.src.cell,pick.m.cell); gameLater(autoSolveStep,400); return; }
  }
  gameLater(autoSolveStep,600);
}

/* ==================== boot ==================== */
S.mode=progress.achievements.tutorial?'normal':'tutorial';
S.M=CONFIG.modes[S.mode];
S.lives=S.M.lives;
if(!themeAvailable(S.theme)) S.theme='classic';
applyTheme();
updateHud();
openMenu();
refreshIcons();
</script>
</body>
</html>
